<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Магазин</title>
    <link rel="stylesheet" href="../style/main.css">
    
</head>
<body>
    <header>
        <div id="logo">
            <h1>Game buy</h1>
        </div>


        <div id="Searched string">
           <form action="/search" method="get" id="searching">
                <input type="search" name="q" placeholder="Поиск...">
                <button type="submit">Найти</button>
            </form>
        </div>


        <div id="next pages">
            <a href="./account.html">
                <img src="../img/person.png">
            </a>

            <a href="./basket.html">
                <img src="../img/basket.png">
            </a>
        </div>

    </header>
    <div id="uved">
    </div>

    <main>
        <div id="sidebar">
            
            <h2> Фильтры </h2>
             <form class="simple-filter">
    
    <div class="filter-block">
        <p><strong>Категория:</strong></p>
    </div>
    
    <div class="filter-block">
        <p><strong>Цена:</strong></p>
        <div class="price-inputs">
            <label>От: <input type="number" name="min" placeholder="0"></label>
            <label>До: <input type="number" name="max" placeholder="10000"></label>
        </div>
    </div>
    
    <div class="filter-block">
        <label><input type="checkbox" name="sale"> Только со скидкой</label>
    </div>
    
    <div class="buttons">
        <button type="submit">Применить</button>
        <button type="reset">Сбросить</button>
    </div>
</form>

        </div>

<div id="catalog">
<div id="sort">
    <select name="sort">
    <option value="popular">По убыванию рейтинга</option>
    <option value="price_asc">По возрастанию рейтинга</option>
    <option value="price_desc">По убыванию рейтинга</option>
    <option value="rating">По возрастанию цены</option>
</select>
</div>
<section id="list" >
</section>

</div>

    </main>

<script src="../scripts/config.js"></script>
<script src="../scripts/display.js"></script>
</body>
</html>
